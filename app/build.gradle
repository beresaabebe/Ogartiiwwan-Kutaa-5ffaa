plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.beckytech.og_artiiwwankutaa5ffaa"
        minSdk 24
        targetSdk 37
        versionCode 10
        versionName "1.7.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.beckytech.og_artiiwwankutaa5ffaa'

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Google Play Services Ads
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    
    // Mediation
    implementation 'com.google.ads.mediation:facebook:6.22.0.0'
    implementation 'com.google.ads.mediation:unity:4.20.0.0'
    implementation 'com.unity3d.ads:unity-ads:4.20.0'

    // In-app update and review
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'

    // Lifecycle and Process observer
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'

    // Fix 16KB Problem
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.sqlite:sqlite-framework:2.7.0'
    implementation 'androidx.room:room-runtime:2.8.4'

    // Facebook SDK
    implementation('com.facebook.android:audience-network-sdk:6.22.0') {
        exclude group: 'com.android.support'
    }
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'

    // Firebase
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.google.firebase:firebase-analytics:23.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}