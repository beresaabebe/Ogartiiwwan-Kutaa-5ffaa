plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    // Target and Compile SDK 36 is great, keeping your 50 apps modern!
    compileSdk 36

    defaultConfig {
        applicationId "com.beckytech.og_artiiwwankutaa5ffaa"
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName "1.7.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // FIX 1: Required for 16 KB memory page support
    // This ensures native libraries (.so files) are aligned correctly for modern CPUs
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.beckytech.og_artiiwwankutaa5ffaa'

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // FIX 2: Update Facebook Audience Network (FAN)
    // Version 6.21.0 is the latest stable version supporting Android 15/16KB page sizes.
    // ✅ FIXED: Reverted to 6.21.0 as 7.1.0 is not yet available in Maven Central.
    implementation('com.facebook.android:audience-network-sdk:6.21.0') {
        exclude group: 'com.android.support'
    }
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}